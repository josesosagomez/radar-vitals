paths:
  manifest: data/manifest.local.csv
  cubes_dir: data/processed/time_domain_cubes
  raw_dir: data/raw
  breathing_rate_dir: data/processed/breathing_rate_hop1   # Step 5 hop1 already uses 30 s windows
  processed_dir: data/processed/heart_rate_hop1_win30
  results_dir: results_hop1_win30

input_policy:
  require_step3_confidence: medium   # string enum: low | medium | high
  reject_step3_review_required: true
  require_quality_mask: true
  require_step5_contract: true
  require_step5_edge_lock_columns: true   # edge_locked / edge_lock_side must be present
  max_bad_fraction: 0.10                  # gate windows with > 10% bad frames
  skip_excluded_sessions: true
  skip_missing_h5: true
  skip_missing_step5: true               # skip (not error) in --all mode

windowing:
  # Hop-1, 30 s window: wider context for HR FFT vs config_hop1_safe.yaml (20 s).
  # Hop stays 1 s; tracker parameters are per-hop so no change needed.
  window_s: 30
  hop_s: 1
  use_stationary_intervals: true         # trim start/end from manifest stationary_intervals

phase:
  method: delta_before_mean              # also supports: mean_phasor (diagnostic)
  impulse_clip_rad: 1.5                  # threshold for remove_impulse_noise (rad/frame)

heart:
  heart_band_hz: [0.8, 2.0]             # cardiac search band (48-120 bpm)
  k_max: 6                               # maximum respiratory harmonic order for ECA
  ahet_deviation_hz: 0.1                 # +/- Hz window for AHET second-harmonic search
  resp_harmonic_guard_hz: 0.05          # coincidence rejection threshold in Hz
  reject_resp_harmonic_coincidence: true # reject windows where selected peak is coincident

  # Step 6.1 - ECA forbidden-zone suppression and strict AHET gate
  eca_mode: skip_forbidden_harmonics_v1
  eca_forbidden_guard_hz: 0.0
  ahet_gate_mode: strict_v1
  candidate_min_second_harmonic_ratio_db: 1.0
  candidate_min_prominence: 3.0
  low_candidate_hz: 1.20
  high_candidate_preference_hz: 1.25
  high_competitor_min_mag_ratio: 0.80

  # Step 6.2 - absolute SNR floor gates (same as config_hop1_safe.yaml)
  candidate_min_peak_to_floor_db: 2.0
  low_candidate_min_peak_to_floor_db: 4.0

  # Step 6.3 - temporal tracker: starting from safe hop-1 parameters.
  # A fresh grid sweep (--grid-preset hop1 --results-root results_hop1_win30) should
  # be run after Step 6 to verify these remain optimal for the 30 s window.
  temporal_tracker:
    enabled: true
    min_fundamental_ratio_db: 2.0
    max_jump_bpm_per_hop: 3.0
    max_gap_windows: 15
    resp_harmonic_mode: score_penalty
    gap_cost: -3.2
    peak_to_floor_weight: 0.25
    prominence_weight: 0.05
    rank_weight: 1.5
    harmonic_weight: 6.0
    harmonic_min_distance_bpm: 0.5

respiration_matching:
  max_resp_match_distance_s: 15.0

comparison:
  min_pi: 0.5
  min_masimo_coverage_fraction: 0.8
  min_masimo_good_pi_fraction: 0.8

seed: 42
