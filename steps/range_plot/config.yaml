# steps/range_plot/config.yaml
# Range-profile visualisation and chest-bin selection.
# Run from the repo root:
#   python steps/range_plot/run.py --session exp003
#   python steps/range_plot/run.py --all --no-animation

seed: 0

manifest: data/manifest.local.csv

# Fixed search window: physical constraint — nothing useful closer than 0.5 m
# or beyond 3.0 m. distance_cm from the manifest is shown as a reference line only.
search_min_m: 0.60
search_max_m: 2.00
top_n_bins: 5

# --- chirp / frame geometry (hardware constants — do not change) ---
chirp:
  num_adc_samples: 256
  num_rx: 4
  num_tx: 1
  num_chirps_per_frame: 32
  frame_rate_hz: 20.0
  range_resolution_m: 0.0436   # confirmed from mmWave Studio Calculated Parameters

# --- plot / visualisation ---
plot:
  max_range_m: 4.0
  animation_fps: 20

# --- logging ---
wandb:
  enabled: false
  project: radar-vitals
