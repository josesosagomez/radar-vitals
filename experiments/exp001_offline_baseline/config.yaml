# exp001 — offline baseline: estimate HR from a recorded capture, compare to Masimo.
# No magic numbers in code — everything tunable lives here (CLAUDE.md s.2).

seed: 0

# --- inputs (place files in data/raw/, never edit them) ---
data:
  radar_bin: data/raw/exp001_sit_140cm_radar.bin
  masimo_csv: data/raw/exp001_sit_140cm_masimo.csv
  logfile_csv: data/raw/exp001_sit_140cm_radar_LogFile.csv
  utc_offset_hours: 3          # Saudi Arabia local time → UTC
  trim_start_s: 30             # skip first 30 s (subject walking into position)

# --- chirp / frame geometry (fill from your mmWave Studio profile) ---
chirp:
  num_adc_samples: 256
  num_rx: 4
  num_tx: 1
  num_chirps_per_frame: 32
  num_frames: 3040          # 152 s × 20 Hz; overridden by infer_num_frames at runtime
  frame_rate_hz: 20.0       # = slow-time / phase sample rate
  range_resolution_m: 0.0436 # confirmed from mmWave Studio Calculated Parameters
  # Enforce Low Power ADC mode + IF bandwidth <= 5 MHz in the profile (TI xWR1642).

# --- vitals processing ---
vitals:
  gate_min_m: 1.1    # covers bins 25-34; chest cluster confirmed at bins 27-29
  gate_max_m: 1.6    # aligned to 0.0436 m/bin
  heart_band_hz: [0.8, 2.0]
  resp_band_hz: [0.1, 0.5]
  window_s: 20            # sliding-window length for each HR estimate
  hop_s: 5                # step between windows
  locked_bin: 29          # confirmed chest bin (1.264 m); explicit pin decouples
                          # bin selection from trim window length
  use_eca: false          # baseline: bandpass+argmax only, no ECA/AHET (exp002 adds ECA)

# --- comparison ---
compare:
  min_pi: 0.5             # Masimo Perfusion Index quality gate

# --- logging ---
wandb:
  enabled: false          # set true once WANDB_API_KEY is exported
  project: radar-vitals
