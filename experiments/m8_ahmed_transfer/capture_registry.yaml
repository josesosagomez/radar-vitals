# M8 Step 1b binding capture registry (base plan section 3.3).
#
# Values are transcribed from the approved plan, NOT measured here: plan section 8 step 3
# forbids opening any real adc_stream.bin or Masimo file during implementation. Every hash,
# lock, and count below is verified against the files at execution time, under
# authorization, and any mismatch is fatal.
#
# The `radar` and `reference` sections are deliberately separate. Radar code is handed only
# the radar section and can never reach a Masimo path; the scorer is handed only the
# reference section and never sees a raw ADC path. See src/m4/capture_registry.py.
#
# Paths are explicit. Do NOT rediscover captures by scanning for a uniform session_id —
# massimo 3 stores `massimo_3`, so a uniform pattern silently misses it.

schema_version: 1
registry_id: m8_ahmed_transfer_captures_v1
root: results/live_demo

# Shared decode geometry. Authoritative source at execution time is each capture's own
# hash-verified metadata; these values must agree with it or the run is fatal.
geometry:
  adc_samples: 256
  rx: 4
  chirps_per_frame: 32
  sample_dtype: complex_int16
  bytes_per_frame: 131072
  iq_swap: true
  frame_rate_hz: 20.0
  range_resolution_m_approx: 0.0436

# Frozen offline grid: contiguous, non-overlapping 600-frame / 30 s windows from k=0.
# The 3 s hop in live metadata is a display/replay value and must not create overlap.
window_grid:
  frames_per_window: 600
  window_seconds: 30
  starts_at_k: 0
  total_windows: 128          # sum of per-capture `windows`
  evaluation_k_ge_1_windows: 120

