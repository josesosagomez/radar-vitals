  data_role: development_apparent_single_subject
  holdout: none
protocol:
  m1: natural
  m2: paced_16_bpm            # target retained as provenance; not scored in this milestone
  sweep: paced_schedule_target_unavailable   # 12/15/18/21 transitions were never persisted
  m3: unknown_protocol_development
  m4: unknown_protocol_development
  m5: unknown_protocol_development
  m6: unknown_protocol_development
