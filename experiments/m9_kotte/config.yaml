# experiments/m9_kotte/config.yaml — the ONE canonical M9 config.
#
# Sections:
#   controls                       — M9.1 direct-Y_t controls and 4-RX ablation
#   synthetic_transfer_diagnostics — M9.2 diagnostic scenarios; never a promotion gate
#   stage_a                        — frozen project adapter/estimator contract
#   radar_evaluation               — M9.3 radar-only cohort and range-lock contract
#   scoring                        — M9.4 reference-only scoring, with no outcome threshold
#
# Control runs persist the whole-file hash and resolved controls-section hash.  No Masimo
# result may change any estimator field below.  The canonical authority is
# plans/m9_kotte_plan.md; retired oracle-gate/GO-NO-GO architecture is absent by design.

schema_version: 1
experiment_id: m9_kotte_joint_doppler_v1

citation:
  title: "Joint Estimation of Single Target's High Amplitude Difference Doppler Frequencies in FMCW Radar"
  authors: "Kotte, Ahmed, Alouini, Al-Naffouri"
  venue: "IEEE Transactions on Radar Systems, vol. 2, 2024"
  doi: "10.1109/TRS.2024.3352189"
  figures_reproduced: "5, 7 (row 2), 8"

# ---------------------------------------------------------------------------------------
# CONTROLS — M9.1 direct Y_t equations (20 RX literal) + declared 4-RX ablation
# ---------------------------------------------------------------------------------------
controls:
  # Paper §IV primary values (Table I page render verified 2026-08-05/06).
  t_pri_s: 0.05
  n_c: 16
  n_r: 20
  snr_db: 0.0
  # SNR = 10*log10((|beta1|^2 + |beta2|^2) / sigma^2), PDF printed p. 118.
  # PRIMARY CANONICAL ASSUMPTION: sigma^2 is per-element post-range/Y_t complex-noise
  # power. This literal 0 dB reading is a declared interpretation, because the PDF does
  # not identify whether sigma^2 is before or after the range FFT.
  snr_definition: two_line_power_ratio
  snr_reference: yt_domain_literal
  # ALTERNATE INTERPRETIVE SENSITIVITY ONLY: +10*log10(128) = 21.07 dB. N_s=128 is
  # reported on PDF printed p. 118, but applying its gain to Y_t is not a paper fact
  # and never sets a real-data noise, loading, validity, or performance rule.
  n_s_fast_time: 128
  mean_removal: none            # §III-B per-row mean removal is in the paper but OFF here:
                                # exact per-channel removal makes R_t exactly singular.
  grid:
    start_hz: -10.0
    stop_hz: 10.0               # half-open [-10, 10): 10.0 itself is NOT a grid point
    step_hz: 0.05
  condition_mask_threshold: 1.0e-8   # rcond(H) below this -> cell masked (f1 ≈ f2 ridge)
  root_seed: 20260806
  # Per-case seed = low 32 bits of sha256("<root_seed>:<case_id>") — order-independent.
  seed_derivation: sha256_root_seed_colon_case_id

  descopes:                     # user decision 1, 2026-08-05
    - fig9_monte_carlo
    - yule_ar_comparator
    - range_estimation          # fast-time setup internally inconsistent (:1336-1338)
    - doa_estimation            # Fig 4 not reproduced; theta0 is KNOWN in all controls

  # Comparators — pinned as DECLARED REPRODUCTION ASSUMPTIONS (the paper is qualitative).
  comparators:
    fft:
      kind: mean_per_rx_periodogram   # each Y_t column's periodogram, no extra window,
      n_fft_comparator: 4096          # zero-padded, incoherently averaged over the RX,
      normalization: max              # amplitude-normalized to its maximum
    music:
      kind: music_pseudospectrum      # covariance Y_t Y_t^H / n_R, no loading,
      model_order: 2                  # primary p=2 (the p=4 audit varies this),
      normalization: max              # 1/(a^H En En^H a) on the same grid, max-normalized
    weak_peak_rule:                   # one peak rule for every row of R1/R3
      merge_radius_hz: 0.25           # local maxima within this radius merge (keep larger)
      top_k: 2                        # weak truth must be hit by one of the top-k peaks
      # AMENDED 2026-08-06 (option B): 0.25 -> 0.625 = the half mainlobe width
      # 1/(2*n_c*t_pri). Two interacting Dirichlet mainlobes displace each other's
      # maxima (measured pulls 0.27-0.46 Hz at the Fig-8 geometry); the paper's
      # "detects both" is qualitative two-peak visibility, not +-0.25 Hz accuracy.
      # NO amplitude criterion is added: none separates a real pulled peak from a
      # pseudospectrum floor bump robustly across realizations, and the one cell this
      # rule is expected to misjudge (MUSIC at beta1/2 counting a floor bump as a
      # detection) errs AGAINST the proposed method's claimed advantage — recorded as
      # a diagnostic, never tuned away.
      weak_tolerance_hz: 0.625

  # R1: Fig 8 amplitude ladder — 3 m / −30°, literal post-range/Y_t 0 dB, (2, 1) Hz.
  r1_fig8:
    theta0_deg: -30.0
    f_strong_hz: 2.0            # carries beta1
    f_weak_hz: 1.0              # carries beta2 = ratio * beta1
    beta1: {re: 0.7071067811865476, im: 0.7071067811865476}   # (1+j)/sqrt(2)
    ratios: [1.0, 0.5, 0.1]
    expected:                   # the behavioral matrix the verdict is judged against
      - {ratio: 1.0, fft_weak: detect, music_weak: detect, proposed: hit}
      - {ratio: 0.5, fft_weak: detect, music_weak: fail, proposed: hit}
      - {ratio: 0.1, fft_weak: fail, music_weak: fail, proposed: hit}

  # R2: Fig 5 surfaces — per-target argmax within one grid step (swap allowed).
  # Table I (page-07 render): amplitudes listed in the same order as the Doppler pair.
  r2_fig5:
    targets:
      - label: fig5a_9m_target2
        theta0_deg: 50.0
        f_pair_hz: [-1.0, -2.0]
        beta1: {re: 0.35355339059327373, im: -0.7071067811865476}   # (0.5−j1)/sqrt(2)
        beta2: {re: 0.7071067811865476, im: 0.35355339059327373}    # (1+j0.5)/sqrt(2)
      - label: fig5b_5m_target3
        theta0_deg: 10.0
        f_pair_hz: [-1.0, 4.0]
        beta1: {re: 0.7071067811865476, im: -0.7071067811865476}    # (1−j1)/sqrt(2)
        beta2: {re: 0.7071067811865476, im: 0.35355339059327373}    # (1+j0.5)/sqrt(2)
      - label: fig5c_3m_target1
        theta0_deg: -30.0
        f_pair_hz: [1.0, 2.5]
        beta1: {re: 0.7071067811865476, im: 0.7071067811865476}     # (1+j1)/sqrt(2)
        beta2: {re: 0.7071067811865476, im: -0.7071067811865476}    # (1−j1)/sqrt(2)

  # R3: Fig 7 row 2 — Δf = 0.5 Hz < 1/CPI = 1.25 Hz. Weak component at 1.0 Hz.
  r3_fig7_row2:
    theta0_deg: -30.0
    f_strong_hz: 1.5            # carries beta1 = (1+j)/sqrt(2)
    f_weak_hz: 1.0              # carries beta2 = beta1/2
    beta1: {re: 0.7071067811865476, im: 0.7071067811865476}
    beta2_ratio: 0.5
    expected: {fft_weak: fail, music_weak: fail, proposed: resolves_both}

  # Audits — ONE field varied each; a passing audit can NEVER upgrade a failed primary.
  # SNR-valued audit overrides are EFFECTIVE Y_t-domain values (documented 2026-08-06).
  audits:
    ensemble_covariance: true         # exact E{Y_t Y_t^H}; Cases-1–4 oracle check
    alternate_range_fft_gain_sensitivity: true  # separately run Fig 5/7/8 at 21.07 dB;
                                                  # diagnostic, nonprimary, no real-data use
    grid_step_hz: [0.02, 0.10]
    mean_removal_on_loading_delta: 1.0e-6   # per-row mean removal ON + tiny loading
    music_model_order: [4]
    merge_radius_hz: [0.15, 0.40]
    fig5_snr_db: [10.0]
    cancellation_ratio: -1.0          # beta2 = −beta1 — the method's own PREDICTED failure

  # Control 2 — 4-RX ablation (paper geometry, synthetic, `ablation` subcommand).
  # Role fixed in advance: equal-amplitude failure is an expected-negative diagnostic.
  # Completion is recorded, but this control is not an empirical gate. No curve claim.
  ablation:
    n_r_endpoints: [20, 4]            # fixed endpoints, same generated realization
    subset_rule: first_four_elements  # the nested 4-RX subset
    loading_delta: [1.0e-2, 1.0e-4]   # both run; trace-relative loading
    rank_rtol: 1.0e-9                 # same numerical rank rule as stage_a
    pass_rule: peak_error_le_one_grid_step_per_case_at_both_endpoints

# ---------------------------------------------------------------------------------------
# SYNTHETIC TRANSFER DIAGNOSTICS — M9.2 controls, never an oracle/promotion gate
# ---------------------------------------------------------------------------------------
synthetic_transfer_diagnostics:
  role: diagnostic_nondeployable
  parameter_promotion_allowed: false
  generator:
    fs_hz: 20.0
    n_frames: 600
    n_chirps: 32
    n_rx: 4
    target_bin: 7
    n_adc_samples: 256
    # Effective carrier is DERIVED from scripts/live_demo_config.yaml (hw_profile), never
    # hardcoded: f_eff = start + slope*(adc_start + n_samples/fs_adc/2) ≈ 79.07 GHz.
    carrier_source: live_demo_config_hw_profile
    # Channel imperfections — applied to the WHOLE column (every slow-time sample of an
    # RX gets the same complex factor), after signal + clutter + noise are summed.
    rx_gain_table: [1.00, 0.92, 1.07, 0.97]
    rx_phase_table_rad: [0.0, 0.40, -0.70, 1.10]
    # Static clutter: per-RX complex DC added in the Z (slow-time × RX) domain, constant
    # over time, relative to unit displacement-signal amplitude.
    rx_clutter_table:
      - {re: 7.0, im: 1.5}
      - {re: -5.5, im: 4.0}
      - {re: 6.0, im: -3.5}
      - {re: -4.5, im: -6.0}
    snr_z_dynamic_db: 10.0      # configured SNR on the mean-removed dynamic component of Z
    snr_tolerance_db: 0.5       # |declared − realized| diagnostic bound
    phase_pairs_rad:            # explicit (phi_b, phi_h) pairs, every scenario × every pair
      - [0.0, 0.0]
      - [0.0, 1.5707963267948966]   # (0, π/2)
      - [0.0, 3.141592653589793]    # (0, π)
      - [1.0, 2.5]
    phase_pair_labels:
      - in_phase
      - quadrature
      - anti_phase_cancellation_diagnostic
      - generic_offset
    root_seed: 20260806
    seed_derivation: sha256_root_seed_colon_case_id

  scenarios:
    - scenario_id: s1_two_rate_small_modulation
      # ±f_b AND ±f_h sidebands — not two cisoids.
      breath_amplitude_m: 5.0e-5      # 0.05 mm
      heart_amplitude_m: 2.5e-5       # 0.025 mm
      f_breath_hz: 0.30
      f_heart_hz: 1.35
    - scenario_id: s2_deep_modulation_decoy
      breath_amplitude_m: 2.0e-3      # 2.0 mm → modulation index ≈ 6.6 rad → Bessel comb
      heart_amplitude_m: 3.0e-4       # 0.3 mm
      f_breath_hz: 0.30               # harmonics at 0.9 / 1.2 / 1.5 / 1.8 Hz
      f_heart_hz: 1.35                # between breathing harmonics k=4 and k=5
    - scenario_id: s3_harmonic_collision
      # f_h = 4·f_b — unresolvable by construction; recorded without a recovery threshold.
      breath_amplitude_m: 2.0e-3
      heart_amplitude_m: 3.0e-4
      f_breath_hz: 0.30
      f_heart_hz: 1.20

  robustness_seeds: [11, 12, 13, 14, 15]
  bessel_diagnostic:
    expansion_order: 32
    max_relative_rms_error: 1.0e-12
    comparison: jacobi_anger_double_sum_against_clean_displacement_phasor
  direct_cisoid_control:
    f_breath_hz: 0.30
    f_heart_hz: 1.35
    beta_breath: {re: 1.0, im: 0.25}
    beta_heart: {re: 0.20, im: -0.10}
    noise_variance: 1.0e-3
    seed: 20260809
  interpretation: >-
    These scenarios diagnose transfer from the paper's two-cisoid model to
    phase-modulated chest displacement. Their outcomes cannot select CPI, loading,
    range, grid, aggregation, or any real-data setting.

# ---------------------------------------------------------------------------------------
# PROJECT ADAPTER / ESTIMATOR CONTRACT — frozen before M9 real-data scoring
# ---------------------------------------------------------------------------------------
stage_a:
  breath_band_hz: [0.10, 0.50]      # tests pin equality with M8's domain and
  heart_band_hz: [0.80, 2.00]       # scripts/live_demo_config.yaml
  grid_step_bpm: 0.5                # signed grid: f1 ∈ ±breath band, f2 ∈ ±heart band
  condition_mask_threshold: 1.0e-8
  rank_rtol: 1.0e-9                 # rank = #{λ_i > rank_rtol·λ_max}; λ_max ≤ 0 → rank 0
  min_valid_cpi_fraction: 1.0       # validated EXACTLY 1.0; any invalid CPI → dsp_failed
  slow_time_selection: fixed_chirp_loop_0
  frame_period_s: 0.05
  window_frames: 600
  retained_frames: 592
  cpi_frames: 16
  cpis_per_window: 37
  tail_policy: drop_frames_592_to_599_before_mean_removal
  mean_removal_scope: retained_support
  evidence_schema_version: 1
  arms:                             # exactly the two plan-authorized real-data arms
    - {arm_id: kotte_cpi_medoid_nc16_dl1em2, n_c: 16, estimator_form: cpi_medoid, loading_delta: 1.0e-2}
    - {arm_id: kotte_cpi_medoid_nc16_dl1em4, n_c: 16, estimator_form: cpi_medoid, loading_delta: 1.0e-4}
  primary_arm_id: kotte_cpi_medoid_nc16_dl1em2
  loading_sensitivity_arm_id: kotte_cpi_medoid_nc16_dl1em4
  window_report: two_dimensional_l1_medoid
  medoid_tie_break: lowest_cpi_index
  signed_alias_rule: collapse_by_absolute_band_coordinates_keep_raw_signs

# ---------------------------------------------------------------------------------------
# RADAR-ONLY EVALUATION — M9.3; no reference paths are present in this section
# ---------------------------------------------------------------------------------------
radar_evaluation:
  range_selection:
    source: current_production_rerun_lock
    selector: src.warmup_select.run_warmup_selection
    selector_config: scripts/live_demo_config.yaml
    recorded_warmup_lock_role: diagnostic_only_never_pooled
    kotte_all_bin_selection_allowed: false
  window_grid:
    window_frames: 600
    step_frames: 600
    interval: half_open
    first_window_role: lock_selection_in_sample
    comparative_windows_start_k: 1
  captures:
    - {capture_id: massimo1, directory: results/live_demo/20260713_172042_live_demo_massimo1,
       subject: A, protocol_role: natural, data_role: exploratory}
    - {capture_id: massimo2, directory: results/live_demo/20260713_182002_live_demo_massimo2,
       subject: A, protocol_role: paced, data_role: exploratory}
    - {capture_id: massimo3, directory: results/live_demo/20260728_224902_live_demo_massimo3,
       subject: B, protocol_role: natural, data_role: exploratory}
    - {capture_id: sweep, directory: results/live_demo/20260714_180523_live_demo_sweep,
       subject: B, protocol_role: stepped, data_role: exploratory}
    - {capture_id: massimo4, directory: results/live_demo/20260728_230903_live_demo_massimo4,
       subject: C, protocol_role: natural, data_role: exploratory}
    - {capture_id: massimo5, directory: results/live_demo/20260728_232415_live_demo_massimo5,
       subject: C, protocol_role: natural, data_role: exploratory}
    - {capture_id: massimo6, directory: results/live_demo/20260729_002158_live_demo_massimo6,
       subject: D, protocol_role: natural, data_role: exploratory}
    - {capture_id: massimo7, directory: results/live_demo/20260729_004815_live_demo_massimo7,
       subject: D, protocol_role: natural, data_role: exploratory}

# ---------------------------------------------------------------------------------------
# REFERENCE SCORING — M9.4; reads immutable radar outputs, never changes the estimator
# ---------------------------------------------------------------------------------------
scoring:
  estimator_settings_mutable_after_scoring: false
  outcome_threshold: none
  timestamp_column: Timestamp
  heart_reference_column: Beats / min
  breath_reference_column: Breaths / min
  window_interval: half_open
  comparative_windows_start_k: 1
  reuse_existing_pi_and_stationarity_gates: true
  metrics: [coverage, mae_bpm, rmse_bpm, bias_bpm, bland_altman_limits]
  summaries: [capture, subject, protocol, lock_estimand]
  constant_session_median_hr_comparator: true
  approximate_origin_label: exploratory_non_frozen
  promotion_eligible: false
  capture_references:
    - {capture_id: massimo1, csv: results/live_demo/20260713_172042_live_demo_massimo1/demo_massimo1.csv}
    - {capture_id: massimo2, csv: results/live_demo/20260713_182002_live_demo_massimo2/demo_massimo2.csv}
    - {capture_id: massimo3, csv: results/live_demo/20260728_224902_live_demo_massimo3/demo_massimo3.csv}
    - {capture_id: sweep, csv: results/live_demo/20260714_180523_live_demo_sweep/demo_sweep.csv}
    - {capture_id: massimo4, csv: results/live_demo/20260728_230903_live_demo_massimo4/demo_massimo4.csv}
    - {capture_id: massimo5, csv: results/live_demo/20260728_232415_live_demo_massimo5/demo_massimo5.csv}
    - {capture_id: massimo6, csv: results/live_demo/20260729_002158_live_demo_massimo6/demo_massimo6.csv}
    - {capture_id: massimo7, csv: results/live_demo/20260729_004815_live_demo_massimo7/demo_massimo7.csv}
