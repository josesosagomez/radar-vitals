# exp000 — diagnostic range-profile visualisation.
# Run for any session listed in data/manifest.local.csv.
# Usage: python experiments/exp000_range_plot/run.py --session exp003
#        python experiments/exp000_range_plot/run.py   (lists available sessions)

seed: 0

manifest: data/manifest.local.csv

# Distance gate: ±gate_margin_m around the manifest distance_cm value.
gate_margin_m: 0.20

# --- chirp / frame geometry (hardware constants — do not change) ---
chirp:
  num_adc_samples: 256
  num_rx: 4
  num_tx: 1
  num_chirps_per_frame: 32
  frame_rate_hz: 20.0
  range_resolution_m: 0.0436   # confirmed from mmWave Studio Calculated Parameters

# --- plot / visualisation ---
plot:
  max_range_m: 4.0
  animation_fps: 20

# --- logging ---
wandb:
  enabled: false
  project: radar-vitals
