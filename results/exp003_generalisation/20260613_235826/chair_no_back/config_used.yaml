# exp003 — Generalisation test, capture 2b: chair without back.
# Identical pipeline to exp002 (ECA + AHET). Only file paths differ from exp002 config.
# Reference: arXiv:2503.07062 (Tang et al., 2025). Cross-review record in notes/approach.md.
# Different day from exp001/exp002 — purpose is to test whether MAE ~5 bpm generalises.
# Collected immediately after capture 2a (chair_back) in the same session.

seed: 0

# --- inputs ---
data:
  radar_bin: data/raw/exp002_sit_chair_no_back_radar.bin
  masimo_csv: data/raw/exp002_sit_chair_no_back_masimo.csv
  logfile_csv: data/raw/exp002_sit_chair_no_back_radar_LogFile.csv
  utc_offset_hours: 3          # Saudi Arabia local time → UTC
  trim_start_s: 30             # matches exp002; 30 s baked in per SESSION.md capture plan

# --- chirp / frame geometry (identical to exp002) ---
chirp:
  num_adc_samples: 256
  num_rx: 4
  num_tx: 2
  num_chirps_per_frame: 32
  num_frames: 3040          # overridden by infer_num_frames at runtime
  frame_rate_hz: 20.0
  range_resolution_m: 0.0436

# --- vitals processing (identical to exp002) ---
vitals:
  gate_min_m: 1.1
  gate_max_m: 1.6
  heart_band_hz: [0.8, 2.0]
  resp_band_hz: [0.1, 0.5]
  window_s: 20
  hop_s: 5
  # locked_bin removed — bin is chosen dynamically as the peak-energy gate bin across all frames

# --- ECA + AHET parameters (arXiv:2503.07062, identical to exp002) ---
eca:
  k_max: 6
  ahet_deviation_hz: 0.1

# --- comparison ---
compare:
  min_pi: 0.5

# --- logging ---
wandb:
  enabled: false
  project: radar-vitals
