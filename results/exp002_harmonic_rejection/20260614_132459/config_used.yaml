# exp002 — ECA + AHET harmonic rejection: same capture as exp001, improved HR estimator.
# Reference: arXiv:2503.07062 (Tang et al., Zhejiang/ASU, 2025).
# Cross-review findings applied: QR projection, parabolic interpolation, local AHET window,
# adaptive K_b with hard floor k=1..4. See notes/approach.md §7.6 for full review record.
# No magic numbers in code — every tunable parameter lives here (CLAUDE.md s.2).

seed: 0

# --- inputs (same raw files as exp001 — read-only, never edited) ---
data:
  radar_bin: data/raw/exp001_sit_140cm_radar.bin
  masimo_csv: data/raw/exp001_sit_140cm_masimo.csv
  logfile_csv: data/raw/exp001_sit_140cm_radar_LogFile.csv
  utc_offset_hours: 3          # Saudi Arabia local time → UTC
  trim_start_s: 30             # 45 s tested and documented as negative result (SESSION.md)

# --- chirp / frame geometry (identical to exp001) ---
chirp:
  num_adc_samples: 256
  num_rx: 4
  num_tx: 2
  num_chirps_per_frame: 32
  num_frames: 3040          # overridden by infer_num_frames at runtime
  frame_rate_hz: 20.0
  range_resolution_m: 0.0436

# --- vitals processing ---
vitals:
  gate_min_m: 1.1
  gate_max_m: 1.6
  heart_band_hz: [0.8, 2.0]
  resp_band_hz: [0.1, 0.5]
  window_s: 20
  hop_s: 5
  locked_bin: 29          # confirmed chest bin (1.264 m); explicit pin decouples
                          # bin selection from trim window length

# --- ECA + AHET parameters (arXiv:2503.07062) ---
eca:
  k_max: 6                   # maximum harmonic order to consider (adaptive cutoff applies)
  ahet_deviation_hz: 0.1     # V_e: local 2nd-harmonic search half-width [2f_h ± V_e]
  # Hard floor k=1..4 is built into eca_project() — not a config parameter.

# --- comparison ---
compare:
  min_pi: 0.5

# --- logging ---
wandb:
  enabled: false
  project: radar-vitals
